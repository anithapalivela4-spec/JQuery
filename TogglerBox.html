<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toggle Box</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .toggle-box {
            width: 500px;
            margin: 100px auto;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .toggle-btn {
            width: 100%;
        }

        .paragraph-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #0d6efd;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="toggle-box">

            <h3 class="text-center mb-4">Toggle Paragraph</h3>

            <!-- Toggle Button -->
            <button id="toggleBtn" class="btn btn-primary toggle-btn">
                Show Paragraph
            </button>

            <!-- Paragraph -->
            <div id="paragraphBox" class="paragraph-box">
                <p class="mb-0">
                    This is a toggle paragraph. When you click the button,
                    this paragraph will be displayed. Click the button again
                    to hide the paragraph.
                </p>
            </div>

        </div>
    </div>

    <script>
        $(document).ready(function () {

            $("#toggleBtn").click(function () {

                $("#paragraphBox").slideToggle(500);

                if ($(this).text() === "Show Paragraph") {
                    $(this).text("Hide Paragraph");
                } else {
                    $(this).text("Show Paragraph");
                }

            });

        });
    </script>

</body>
</html>
