<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Signup</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #333;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
        }

        .btn-custom {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #667eea;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background: #5568d9;
            color: white;
        }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
        }

        .toggle-link {
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        #signupForm {
            display: none;
        }

        .password-box {
            position: relative;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
            color: #667eea;
            font-size: 14px;
        }

        .message {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container-box">

    <!-- LOGIN FORM -->
    <div id="loginForm">

        <h2 class="title">Login</h2>

        <form id="login">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail"
                       class="form-control"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="mb-3 password-box">
                <label class="form-label">Password</label>

                <input type="password"
                       id="loginPassword"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

                <span class="show-password"
                      id="showLoginPassword">
                    Show
                </span>
            </div>

            <button type="submit" class="btn btn-custom">
                Login
            </button>

        </form>

        <div class="message alert alert-success">
            Login Successful!
        </div>

        <p class="toggle-text">
            Don't have an account?
            <span class="toggle-link" id="showSignup">
                Sign Up
            </span>
        </p>

    </div>


    <!-- SIGNUP FORM -->
    <div id="signupForm">

        <h2 class="title">Sign Up</h2>

        <form id="signup">

            <div class="mb-3">
                <label class="form-label">Full Name</label>

                <input type="text"
                       id="name"
                       class="form-control"
                       placeholder="Enter your name"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>

                <input type="email"
                       id="signupEmail"
                       class="form-control"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="mb-3 password-box">
                <label class="form-label">Password</label>

                <input type="password"
                       id="signupPassword"
                       class="form-control"
                       placeholder="Create password"
                       required>

                <span class="show-password"
                      id="showSignupPassword">
                    Show
                </span>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>

                <input type="password"
                       id="confirmPassword"
                       class="form-control"
                       placeholder="Confirm password"
                       required>
            </div>

            <button type="submit" class="btn btn-custom">
                Create Account
            </button>

        </form>

        <div class="message alert alert-success">
            Account Created Successfully!
        </div>

        <p class="toggle-text">
            Already have an account?
            <span class="toggle-link" id="showLogin">
                Login
            </span>
        </p>

    </div>

</div>


<script>

$(document).ready(function () {

    // Show Signup and Hide Login
    $("#showSignup").click(function () {

        $("#loginForm").hide();
        $("#signupForm").show();

    });


    // Show Login and Hide Signup
    $("#showLogin").click(function () {

        $("#signupForm").hide();
        $("#loginForm").show();

    });


    // Login Password Show / Hide
    $("#showLoginPassword").click(function () {

        let password = $("#loginPassword");

        if (password.attr("type") === "password") {

            password.attr("type", "text");
            $(this).text("Hide");

        } else {

            password.attr("type", "password");
            $(this).text("Show");

        }

    });


    // Signup Password Show / Hide
    $("#showSignupPassword").click(function () {

        let password = $("#signupPassword");

        if (password.attr("type") === "password") {

            password.attr("type", "text");
            $(this).text("Hide");

        } else {

            password.attr("type", "password");
            $(this).text("Show");

        }

    });


    // Login Form Submit
    $("#login").submit(function (event) {

        event.preventDefault();

        $(".message").hide();

        $("#loginForm .message")
            .fadeIn();

    });


    // Signup Form Submit
    $("#signup").submit(function (event) {

        event.preventDefault();

        let password = $("#signupPassword").val();
        let confirmPassword = $("#confirmPassword").val();

        if (password !== confirmPassword) {

            alert("Passwords do not match!");
            return;

        }

        $("#signupForm .message")
            .fadeIn();

    });

});

</script>

</body>
</html>
