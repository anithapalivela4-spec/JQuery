<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Signup Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .form-container {
            width: 400px;
            margin: 70px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        .form-title {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .btn-custom {
            width: 100%;
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
        }

        .switch-link {
            color: #0d6efd;
            font-weight: bold;
            cursor: pointer;
        }

        #signupForm {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-container">

        <!-- ================= LOGIN FORM ================= -->

        <div id="loginForm">

            <h2 class="form-title">Login</h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input type="email"
                           id="loginEmail"
                           class="form-control"
                           placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>

                    <div class="input-group">
                        <input type="password"
                               id="loginPassword"
                               class="form-control"
                               placeholder="Enter password">

                        <button type="button"
                                class="btn btn-outline-secondary"
                                id="showLoginPassword">
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="btn btn-primary btn-custom">
                    Login
                </button>

            </form>

            <p class="switch-text">
                Don't have an account?
                <span class="switch-link" id="showSignup">
                    Sign Up
                </span>
            </p>

        </div>


        <!-- ================= SIGNUP FORM ================= -->

        <div id="signupForm">

            <h2 class="form-title">Sign Up</h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>

                    <input type="text"
                           id="signupName"
                           class="form-control"
                           placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input type="email"
                           id="signupEmail"
                           class="form-control"
                           placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>

                    <div class="input-group">

                        <input type="password"
                               id="signupPassword"
                               class="form-control"
                               placeholder="Create password">

                        <button type="button"
                                class="btn btn-outline-secondary"
                                id="showSignupPassword">
                            Show
                        </button>

                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>

                    <input type="password"
                           id="confirmPassword"
                           class="form-control"
                           placeholder="Confirm password">
                </div>

                <button type="submit"
                        class="btn btn-success btn-custom">
                    Create Account
                </button>

            </form>

            <p class="switch-text">
                Already have an account?
                <span class="switch-link" id="showLogin">
                    Login
                </span>
            </p>

        </div>

    </div>

</div>


<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>

$(document).ready(function () {

    // ===============================
    // SHOW SIGNUP FORM
    // ===============================

    $("#showSignup").click(function () {

        $("#loginForm").hide();

        $("#signupForm").fadeIn();

    });


    // ===============================
    // SHOW LOGIN FORM
    // ===============================

    $("#showLogin").click(function () {

        $("#signupForm").hide();

        $("#loginForm").fadeIn();

    });


    // ===============================
    // SHOW / HIDE LOGIN PASSWORD
    // ===============================

    $("#showLoginPassword").click(function () {

        let password = $("#loginPassword");

        if (password.attr("type") === "password") {

            password.attr("type", "text");

            $(this).text("Hide");

        } else {

            password.attr("type", "password");

            $(this).text("Show");

        }

    });


    // ===============================
    // SHOW / HIDE SIGNUP PASSWORD
    // ===============================

    $("#showSignupPassword").click(function () {

        let password = $("#signupPassword");

        if (password.attr("type") === "password") {

            password.attr("type", "text");

            $(this).text("Hide");

        } else {

            password.attr("type", "password");

            $(this).text("Show");

        }

    });


    // ===============================
    // SIGNUP VALIDATION
    // ===============================

    $("#signupForm form").submit(function (event) {

        event.preventDefault();

        let name = $("#signupName").val();
        let email = $("#signupEmail").val();
        let password = $("#signupPassword").val();
        let confirmPassword = $("#confirmPassword").val();


        if (name === "") {

            alert("Please enter your name");
            return;

        }


        if (email === "") {

            alert("Please enter your email");
            return;

        }


        if (password === "") {

            alert("Please enter your password");
            return;

        }


        if (password !== confirmPassword) {

            alert("Passwords do not match");
            return;

        }


        alert("Signup Successful!");

    });


    // ===============================
    // LOGIN VALIDATION
    // ===============================

    $("#loginForm form").submit(function (event) {

        event.preventDefault();

        let email = $("#loginEmail").val();
        let password = $("#loginPassword").val();


        if (email === "") {

            alert("Please enter your email");
            return;

        }


        if (password === "") {

            alert("Please enter your password");
            return;

        }


        alert("Login Successful!");

    });

});

</script>

</body>
</html>
